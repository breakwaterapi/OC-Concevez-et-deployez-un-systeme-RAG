name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Check formatting
        run: uv run ruff format --check src/

      - name: Check linting
        run: uv run ruff check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run tests
        run: uv run pytest tests/unit/ tests/api/ -v

  # Reduced RAGAS evaluation (4 questions, incl. 1 out-of-corpus) against a committed fixture
  # index — a coarse smoke check, not a quality gate. Skips itself when MISTRAL_API_KEY is
  # absent (e.g. before the secret is configured on this repository).
  ragas-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run reduced RAGAS evaluation
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: uv run pytest tests/eval/ -v -m ragas_ci
