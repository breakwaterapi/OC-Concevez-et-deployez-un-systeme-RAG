[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/notebooks", "src/ui"]

[project]
name = "rag"
version = "0.9.1"
description = "RAG system for cultural event recommendations — Puls-Events POC"
authors = [
  { name = "LEFEVRE Kilian" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # Core RAG
    "langchain>=1.3.4",
    "langchain-community>=0.3.0,<0.4.2",
    "langchain-mistralai>=1.1.5",
    "langchain-text-splitters>=0.3.0",
    "mistralai>=2,<3",
    "faiss-cpu>=1.14.2",
    "mistral-common",
    # Data processing
    "docling>=2.97.0",
    "pandas",
    "pyarrow>=24.0.0",
    "numpy",
    # API
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # Logging
    "loguru>=0.7.0",
    # Utilities
    "python-dotenv",
    "requests",
    "httpx>=0.27.0",
    "pyright>=1.1.410",
    # UI
    "streamlit>=1.36.0",
    "tqdm>=4.67.3",
]
requires-python = "~=3.12.0"

[dependency-groups]
dev = [
    # Evaluation / research
    "ragas>=0.4.3",
    "mlflow>=2.14.0",
    # Notebooks
    "jupyterlab",
    "notebook",
    "ipython",
    "ipywidgets>=8.1.8",
    "matplotlib",
    # Testing
    "pytest",
    "httpx",
    # Code quality
    "ruff",
    "pytest-cov>=7.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring external APIs (MISTRAL_API_KEY) and local FAISS index",
    "ragas_ci: reduced RAGAS evaluation (4 questions) requiring MISTRAL_API_KEY, meant for CI/local smoke checks",
]

[tool.coverage.run]
source = ["src/api"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "notebooks/**/*.ipynb"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "notebooks"]
force-sort-within-sections = true
