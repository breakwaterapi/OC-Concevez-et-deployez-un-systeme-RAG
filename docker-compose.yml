services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./models:/app/models
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: .
    ports:
      - "8502:8502"
    env_file: .env
    environment:
      API_BASE_URL: "http://api:8001"
    depends_on:
      api:
        condition: service_healthy
    command: >
      uv run streamlit run src/ui/app.py
      --server.port 8502
      --server.address 0.0.0.0
      --server.headless true